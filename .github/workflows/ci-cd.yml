name: CI/CD (Lambda de autenticacao)

# Fluxo:
#   PR / push desenvolvimento -> testes + fmt + validate + plan (hml e prd)
#   push homologacao          -> testes + build + apply no workspace hml
#   push master               -> testes + build + apply no workspace prd
#   workflow_dispatch         -> plan | apply | destroy no ambiente escolhido
#
# PRE-REQUISITO: a plataforma (oficina-infra-k8s) e o banco
# (oficina-infra-database) precisam estar aplicados NAQUELE ambiente - este
# repositorio le os dois states via terraform_remote_state.
#
# Configuracao necessaria no repositorio:
#   Secrets:   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   Variables: TF_STATE_BUCKET (a MESMA bucket das outras camadas)
#              AWS_REGION (opcional, default us-east-1)

on:
  pull_request:
  push:
    branches: [master, homologacao, desenvolvimento]
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente (workspace do Terraform)
        type: choice
        required: true
        default: hml
        options: [hml, prd]
      action:
        description: Acao do Terraform
        type: choice
        required: true
        default: plan
        options: [plan, apply, destroy]

permissions:
  contents: read
  pull-requests: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VERSION: latest
  NODE_VERSION: '22'
  TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}

jobs:
  testes:
    name: Testes unitarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # node:test nativo - sem framework de teste no pacote da Lambda.
      - name: npm test
        run: npm test

  validate:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt -check
        run: terraform fmt -check -recursive -diff

      - name: terraform validate
        run: |
          terraform init -backend=false
          terraform validate -no-color

  plan:
    name: plan (${{ matrix.environment }})
    needs: [testes, validate]
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_name == 'desenvolvimento') || (github.event_name == 'workflow_dispatch' && inputs.action == 'plan')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.environment)) || fromJSON('["hml","prd"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # O archive_file empacota build/; sem esta etapa o plan falha com
      # "no such file or directory".
      - name: Monta o pacote da Lambda
        run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=$AWS_REGION"

      - name: Seleciona o workspace ${{ matrix.environment }}
        working-directory: infra
        run: terraform workspace select -or-create "${{ matrix.environment }}"

      - name: terraform plan
        id: plan
        working-directory: infra
        run: |
          terraform plan -no-color -input=false | tee plan.txt
          {
            echo 'stdout<<PLAN_EOF'
            tail -c 40000 plan.txt
            echo 'PLAN_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Comenta o plano no PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
          ENVIRONMENT: ${{ matrix.environment }}
        with:
          script: |
            const env = process.env.ENVIRONMENT;
            const marker = `<!-- terraform-plan-lambda-${env} -->`;
            const body = `${marker}\n### Terraform plan — Lambda + API Gateway (\`${env}\`)\n\n<details><summary>Ver plano</summary>\n\n\`\`\`terraform\n${process.env.PLAN}\n\`\`\`\n\n</details>`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

  deploy:
    name: deploy (${{ (github.event_name == 'workflow_dispatch' && inputs.environment) || (github.ref_name == 'master' && 'prd') || 'hml' }})
    needs: [testes, validate]
    if: (github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == 'homologacao')) || (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment) || (github.ref_name == 'master' && 'producao') || 'homologacao' }}
    env:
      TF_WORKSPACE_ENV: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment) || (github.ref_name == 'master' && 'prd') || 'hml' }}
    concurrency:
      group: lambda-auth-${{ (github.event_name == 'workflow_dispatch' && inputs.environment) || (github.ref_name == 'master' && 'prd') || 'hml' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Monta o pacote da Lambda
        run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=$AWS_REGION"

      - name: Seleciona o workspace $TF_WORKSPACE_ENV
        working-directory: infra
        run: terraform workspace select -or-create "$TF_WORKSPACE_ENV"

      - name: terraform apply
        working-directory: infra
        timeout-minutes: 20
        run: terraform apply -auto-approve -no-color -input=false

      - name: Endpoints publicados
        working-directory: infra
        run: terraform output -no-color

      # Prova de vida do gateway: /auth precisa responder (501 enquanto a
      # emissao de token nao estiver implementada, 200/400 depois disso).
      # Um 403/404 aqui significa rota ou permissao errada.
      - name: Smoke test do endpoint de autenticacao
        working-directory: infra
        run: |
          URL="$(terraform output -raw auth_endpoint)"
          echo "POST $URL"
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST "$URL" -H 'content-type: application/json' -d '{"cpf":"00000000000"}')
          echo "HTTP $STATUS"
          case "$STATUS" in
            200|400|404|403|501) echo "Gateway respondendo." ;;
            *) echo "::error::Resposta inesperada do gateway (HTTP $STATUS)."; exit 1 ;;
          esac

  destroy:
    name: destroy (${{ inputs.environment }})
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'prd' && 'producao' || 'homologacao' }}
    concurrency:
      group: lambda-auth-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # O archive_file e avaliado tambem no destroy.
      - name: Monta o pacote da Lambda
        run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=$AWS_REGION"

      - name: Seleciona o workspace ${{ inputs.environment }}
        working-directory: infra
        run: terraform workspace select "${{ inputs.environment }}"

      - name: terraform destroy
        working-directory: infra
        timeout-minutes: 20
        run: terraform destroy -auto-approve -no-color -input=false
